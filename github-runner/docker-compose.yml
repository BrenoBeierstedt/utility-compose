services:
  runner:
    image: myoung34/github-runner:latest
    restart: always
    env_file:
      - ./.env
    environment:
      - RUNNER_SCOPE=org
      - ORG_NAME=sync-mate
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - LABELS=linux,self-hosted
      - EPHEMERAL=1
      - RANDOM_RUNNER_SUFFIX=true
      - RUNNER_NAME_PREFIX=syncmate
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.18'
          memory: 2048M
        reservations:
          cpus: '0.10'
          memory: 1024M
