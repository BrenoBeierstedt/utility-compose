

services:
Docker Registry
  # ===========================================
  registry:
    image: registry:2
    container_name: ${COMPOSE_PROJECT_NAME}-registry
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: :${REGISTRY_PORT}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "${REGISTRY_REALM}"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - ${REGISTRY_STORAGE_PATH}:/var/lib/registry
      - ./auth:/auth
    ports:
      - "${REGISTRY_PORT}:${REGISTRY_PORT}"
    networks:
      - syncmate_hom

  # ===========================================
  # Docker Registry Web UI
  # ===========================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: ${COMPOSE_PROJECT_NAME}-ui
    restart: unless-stopped
    environment:
      - REGISTRY_TITLE=${UI_TITLE}
      - REGISTRY_URL=http://registry:${REGISTRY_PORT}
      - SINGLE_REGISTRY=true
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      - registry
      - postgres
    ports:
      - "${UI_PORT}:80"
    networks:
      - syncmate_hom

networks:
  syncmate_hom:
    driver: external
