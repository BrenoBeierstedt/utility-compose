services:

  typebot-builder:
    image: baptistearno/typebot-builder:3.4.2
    restart: always
    ports:
      - '8082:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: .env
    networks:
      - syncmate_hom

  typebot-viewer:
    image: baptistearno/typebot-viewer:3.4.2
    restart: always
    ports:
      - '8081:3000'
    env_file: .env
    networks:
      - syncmate_hom

networks:
  syncmate_hom:
    external: true
