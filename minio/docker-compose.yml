services:
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - syncmate_hom
    volumes:
      - './minio_data:/data'
    environment:
      - MINIO_ROOT_USER=syncmate
      - MINIO_ROOT_PASSWORD=sync.mate
      - MINIO_DEFAULT_BUCKETS=syncmate

networks:
  syncmate_hom:
    external: true
