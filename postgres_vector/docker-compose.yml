version: '3.8'

networks:
  syncmate_hom:
    external: true

services:
  postgres_hom:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=sync_hom
      # Please provide your own password.
      - POSTGRES_PASSWORD=sync.mate
    networks:
      - syncmate_hom
